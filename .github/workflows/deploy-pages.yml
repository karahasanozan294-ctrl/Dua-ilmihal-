name: Canlı Web & iOS Safari Yayınla (GitHub Pages)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  web-zip:
    name: Evrensel Web Paketi (Netlify / Cloudflare / Sunucu)
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodları indir
        uses: actions/checkout@v5

      - name: Node.js 22 kur
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Bağımlılıkları yükle
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Web & PWA paketini derle
        run: |
          VITE_BASE_PATH="/" npm run build
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Web paketini Artifact olarak yükle
        uses: actions/upload-artifact@v6
        with:
          name: Mihrab-Web-Paketi
          path: dist
          if-no-files-found: error
          retention-days: 30

  build:
    name: GitHub Pages Web & PWA Derleme
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodları indir
        uses: actions/checkout@v5

      - name: Node.js 22 kur
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Bağımlılıkları yükle
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: GitHub Pages ayarlarını oku
        id: pages
        uses: actions/configure-pages@v5

      - name: Canlı Web & iOS PWA derle
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_LOWER=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')
          if [ "$REPO_LOWER" = "${OWNER_LOWER}.github.io" ]; then
            export VITE_BASE_PATH="/"
          else
            export VITE_BASE_PATH="/${REPO_NAME}/"
          fi
          echo "VITE_BASE_PATH=$VITE_BASE_PATH"
          npm run build
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: GitHub Pages paketini yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Canlı Sunucuya Yayınla
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages üzerinde yayınla
        id: deployment
        uses: actions/deploy-pages@v4
