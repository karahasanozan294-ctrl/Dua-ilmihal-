name: Windows EXE Oluştur

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows-exe:
    name: Mihrab Windows EXE Derleme
    runs-on: windows-latest

    steps:
      - name: Kaynak kodları indir
        uses: actions/checkout@v5

      - name: Node.js 22 kur
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Web bağımlılıklarını yükle
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Web uygulamasını derle
        run: npm run build

      - name: Electron ve paketleyiciyi kur
        run: npm install --no-save electron@^35.0.0 electron-builder@^26.0.0 --no-audit --no-fund

      - name: Windows uygulama simgesini doğrula
        run: node scripts/generate-win-icons.mjs

      - name: Taşınabilir Windows EXE oluştur
        run: npx electron-builder --config electron-builder.json --win portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: EXE dosyasını GitHub Artifact olarak yükle
        uses: actions/upload-artifact@v6
        with:
          name: Mihrab-Windows-EXE
          path: release/Mihrab-Windows-Portable.exe
          if-no-files-found: error
          retention-days: 30
