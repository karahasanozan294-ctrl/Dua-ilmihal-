name: Android APK Oluştur

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Mihrab Android APK Derleme
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodları indir
        uses: actions/checkout@v5

      - name: Node.js 22 kur
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Java 21 (JDK) kur
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Android SDK (Platform 36 ve Build Tools) kur
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Bağımlılıkları yükle
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Web uygulamasını derle
        run: npm run build

      - name: Capacitor Android projesini hazırla
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          node scripts/configure-android.mjs

      - name: Debug APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK dosyasını GitHub Artifact olarak yükle
        uses: actions/upload-artifact@v6
        with:
          name: Mihrab-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
