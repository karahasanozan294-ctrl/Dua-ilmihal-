name: iOS IPA Oluştur

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios-ipa:
    name: Mihrab iOS IPA Derleme
    runs-on: macos-latest

    steps:
      - name: Kaynak kodları indir
        uses: actions/checkout@v5

      - name: Node.js 22 kur
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Bağımlılıkları yükle
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Web uygulamasını derle
        run: npm run build

      - name: Capacitor iOS projesini hazırla
        run: |
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          node scripts/configure-ios.mjs

      - name: CocoaPods varsa kur
        run: |
          if [ -f "ios/App/Podfile" ]; then
            cd ios/App && pod install
          fi

      - name: Swift Paket Bağımlılıklarını Çözümle
        run: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            xcodebuild -workspace ios/App/App.xcworkspace -scheme App -derivedDataPath "$RUNNER_TEMP/DerivedData" -resolvePackageDependencies
          else
            xcodebuild -project ios/App/App.xcodeproj -scheme App -derivedDataPath "$RUNNER_TEMP/DerivedData" -resolvePackageDependencies
          fi

      - name: iOS uygulamasını derle ve IPA paketle
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISION_BASE64: ${{ secrets.IOS_PROVISION_BASE64 }}
        run: |
          mkdir -p build-output

          if [ -d "ios/App/App.xcworkspace" ]; then
            BUILD_TARGET=(-workspace ios/App/App.xcworkspace)
          else
            BUILD_TARGET=(-project ios/App/App.xcodeproj)
          fi

          if [ -n "$IOS_P12_BASE64" ] && [ -n "$IOS_PROVISION_BASE64" ]; then
            echo "Apple Developer imzalama sertifikaları algılandı, imzalı IPA derleniyor..."
            KEYCHAIN_PATH="$RUNNER_TEMP/mihrab-signing.keychain-db"
            security create-keychain -p "mihrab-temp" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "mihrab-temp" "$KEYCHAIN_PATH"

            echo "$IOS_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH"

            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/mihrab.mobileprovision"
            echo "$IOS_PROVISION_BASE64" | base64 --decode > "$PROFILE_PATH"

            PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< $(security cms -D -i "$PROFILE_PATH"))
            TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' /dev/stdin <<< $(security cms -D -i "$PROFILE_PATH"))

            xcodebuild "${BUILD_TARGET[@]}" \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/Mihrab.xcarchive" \
              archive \
              CODE_SIGN_STYLE=Manual \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID"

            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0">' \
              '<dict>' \
              '  <key>method</key><string>ad-hoc</string>' \
              "  <key>teamID</key><string>${TEAM_ID}</string>" \
              '  <key>signingStyle</key><string>manual</string>' \
              '  <key>provisioningProfiles</key>' \
              '  <dict>' \
              "    <key>com.mihrab.namazvakti</key><string>${PROFILE_UUID}</string>" \
              '  </dict>' \
              '</dict>' \
              '</plist>' > "$RUNNER_TEMP/ExportOptions.plist"

            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/Mihrab.xcarchive" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
              -exportPath build-output

            IPA_FOUND=$(find build-output -name "*.ipa" | head -n 1)
            mv "$IPA_FOUND" build-output/Mihrab-iOS.ipa
          else
            echo "İmzalama sertifikası bulunamadı; AltStore/Sideloadly/SideStore uyumlu imzasız IPA derleniyor..."
            xcodebuild "${BUILD_TARGET[@]}" \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_IDENTITY="" \
              CODE_SIGN_STYLE=Manual \
              DEVELOPMENT_TEAM=""

            APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 3 -type d -name "*.app" | head -n 1)
            if [ -z "$APP_PATH" ]; then
              echo "Derlenmiş .app paketi bulunamadı!"
              exit 1
            fi
            mkdir -p "$RUNNER_TEMP/ipa-stage/Payload"
            cp -R "$APP_PATH" "$RUNNER_TEMP/ipa-stage/Payload/App.app"
            (cd "$RUNNER_TEMP/ipa-stage" && zip -qry "$GITHUB_WORKSPACE/build-output/Mihrab-iOS.ipa" Payload)
          fi

          ls -lh build-output/Mihrab-iOS.ipa

      - name: IPA dosyasını GitHub Artifact olarak yükle
        uses: actions/upload-artifact@v6
        with:
          name: Mihrab-iOS-IPA
          path: build-output/Mihrab-iOS.ipa
          if-no-files-found: error
          retention-days: 30
